name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI build
        run: make web-build

      - name: Every quality gate (fmt, vet, lint, staticcheck, test, coverage)
        run: make check

      - name: Bundle budget
        run: make bundle-check

      - name: Binary size budget
        run: make size-check

      - name: GoReleaser config lint (static check only, no build/publish)
        run: make release-check

      - name: Integration smoke test
        run: make smoke

      - name: Docs dependencies
        run: make docs-deps

      - name: CLI reference drift check
        run: make docs-drift-check

      - name: Docs build
        run: make docs-build

      - name: Docs link check
        run: make docs-link-check

      - name: Docs recipe verification
        run: make docs-verify-recipes
