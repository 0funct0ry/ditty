# Three example recipes (SPEC.md §11), selected by profile:
#
#   docker compose --profile monitor up      # read-only broadcast
#   docker compose --profile shell-tls up    # authenticated shell behind TLS
#   docker compose --profile nginx up        # nginx-fronted, trusted-header auth
#
# These are demonstrations of how the pieces fit together, not production
# hardening advice on their own — read the comments on each service before
# reusing one as-is.
#
# Note: the "nginx-fronted" recipe proxies to ditty over plain TCP on the
# compose network, not a Unix socket. ditty does not currently have a flag
# to listen on a Unix socket (only TCP/TLS listeners exist), so a
# Unix-socket-fronted recipe isn't something this compose file can honestly
# demonstrate yet.
services:
  # Read-only broadcast: share a live view of `htop` with anyone who has the
  # URL, and nobody can type into it. --insecure-no-auth is used here only
  # because this is a local demo profile; do not run a real deployment this
  # way unless "anyone with the URL can watch" is genuinely the intent.
  monitor:
    profiles: ["monitor"]
    image: ghcr.io/0funct0ry/ditty:latest
    ports:
      - "7654:7654"
    command: ["--insecure-no-auth", "htop"]

  # Authenticated shell behind TLS: a writable bash session, gated by HTTP
  # basic auth whose password is supplied through a Docker secret rather
  # than an environment variable, and served over HTTPS using a mounted
  # certificate pair.
  shell-tls:
    profiles: ["shell-tls"]
    image: ghcr.io/0funct0ry/ditty:latest
    ports:
      - "7654:7654"
    environment:
      DITTY_TLS_CERT: /certs/tls.crt
      DITTY_TLS_KEY: /certs/tls.key
      DITTY_BASIC_AUTH_FILE: /run/secrets/ditty_basic_auth
    volumes:
      - ./examples/certs:/certs:ro
    secrets:
      - ditty_basic_auth
    command: ["-w", "bash"]

  # nginx-fronted: ditty trusts an X-Auth-User header set by nginx (which,
  # in a real deployment, would itself be behind an auth proxy such as
  # oauth2-proxy) instead of authenticating requests itself.
  # DITTY_TRUST_PROXY must list nginx's address on the compose network so
  # the header is only honoured when it actually comes from nginx.
  nginx-backend:
    profiles: ["nginx"]
    image: ghcr.io/0funct0ry/ditty:latest
    environment:
      DITTY_BASE_PATH: /term
      DITTY_TRUST_PROXY: 172.16.0.0/12
      DITTY_TRUST_HEADER: X-Auth-User
    command: ["-w", "bash"]

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./examples/nginx/ditty.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-backend

secrets:
  ditty_basic_auth:
    file: ./examples/secrets/ditty_basic_auth.txt
