# Example reverse-proxy config for docker-compose.yml's "nginx" profile.
# Forwards to ditty over the compose network and sets the header ditty is
# configured to trust (DITTY_TRUST_HEADER=X-Auth-User). In a real
# deployment, an auth layer in front of nginx (not shown here) would be
# what actually establishes X-Auth-User's value.
server {
    listen 80;

    location /term/ {
        proxy_pass http://nginx-backend:7654/term/;
        proxy_http_version 1.1;

        # Required for the /ws WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Auth-User "demo-user";
    }
}
