<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">ditty</title>
  <desc id="desc">ditty — share a terminal over the web, read-only by default, zero configuration</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#161a24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a24"/>
      <stop offset="100%" stop-color="#12151d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22b8ad"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="1" width="1198" height="298" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)" stroke="#242938" stroke-width="1.5"/>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#glow)"/>
    <!-- faint background grid for depth -->
    <g stroke="#ffffff" stroke-opacity="0.025">
      <line x1="0" y1="75" x2="1200" y2="75"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="225" x2="1200" y2="225"/>
    </g>
  </g>

  <!-- window chrome bar -->
  <rect x="1" y="1" width="1198" height="46" rx="20" fill="url(#panel)"/>
  <rect x="1" y="27" width="1198" height="20" fill="url(#panel)"/>
  <line x1="1" y1="47" x2="1199" y2="47" stroke="#242938" stroke-width="1"/>

  <circle cx="32" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="24" r="6" fill="#27c93f"/>

  <!-- address pill: the shared, read-only link -->
  <rect x="470" y="12" width="260" height="24" rx="12" fill="#0d0f16" stroke="#2a2f3d"/>
  <circle cx="488" cy="24" r="3.5" fill="#34d399"/>
  <text x="500" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b93a7">ditty.local/t/9f2ab1e4</text>

  <rect x="1104" y="12" width="80" height="24" rx="12" fill="#0f1c19" stroke="#1f4a3d"/>
  <text x="1144" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34d399" font-weight="600">read-only</text>

  <!-- brand mark -->
  <rect x="72" y="96" width="52" height="52" rx="14" fill="url(#mark)"/>
  <text x="98" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="#0b0d12">&gt;_</text>

  <text x="148" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="46" font-weight="700" fill="#f2f4f8" letter-spacing="-1">ditty</text>
  <text x="148" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b93a7">share a terminal over the web — read-only by default, zero config</text>

  <!-- terminal command line -->
  <rect x="72" y="196" width="1056" height="56" rx="10" fill="#0d0f16" stroke="#242938"/>
  <text x="96" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#34d399">$</text>
  <text x="118" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#dfe3ea">ditty htop</text>
  <rect x="248" y="215" width="10" height="20" fill="#34d399" opacity="0.85"/>
  <text x="290" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5b6274">read-only by default · secure by design · zero config</text>
</svg>
